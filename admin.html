<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบหยิบสินค้า & พิมพ์ใบปะหน้าพัสดุ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white; }
      .print-card { break-inside: avoid; border: 2px solid #000 !important; box-shadow: none !important; margin-bottom: 16px; }
    }
  </style>
</head>
<body class="bg-stone-100 p-6 font-sans">

  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6 no-print">
      <h1 class="text-2xl font-bold">📦 ระบบ Pick & Pack และพิมพ์ใบจ่าหน้า</h1>
      <div class="space-x-2">
        <button onclick="loadOrders()" class="bg-stone-700 text-white px-4 py-2 rounded-lg">รีเฟรชข้อมูล</button>
        <button onclick="window.print()" class="bg-amber-700 text-white px-4 py-2 rounded-lg font-bold">🖨️ สั่งพิมพ์ใบปะหน้าทั้งหมด</button>
      </div>
    </div>

    <div id="loading" class="text-center py-10 text-stone-500 no-print">กำลังโหลดข้อมูลออเดอร์จาก Google Sheets...</div>
    <div id="ordersContainer" class="grid md:grid-cols-2 gap-4"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZmlPmTuC3rHJIeekFmNWf3xeeUBrVmzDAcjO564xzyJYI3PRaVmc89a1sGfLn_5zd/exec";

    async function loadOrders() {
      document.getElementById('loading').style.display = 'block';
      const container = document.getElementById('ordersContainer');
      container.innerHTML = '';

      try {
        const res = await fetch(SCRIPT_URL);
        const orders = await res.json();
        document.getElementById('loading').style.display = 'none';

        orders.forEach(order => {
          const card = document.createElement('div');
          card.className = "bg-white p-5 rounded-xl border border-stone-300 shadow-sm print-card";
          card.innerHTML = `
            <!-- ส่วนผู้ส่ง -->
            <div class="text-xs text-stone-600 border-b pb-2 mb-3 flex justify-between">
              <div>
                <strong>ผู้ส่ง:</strong> CRAFT CACAO BAR (โทร. 02-000-0000)<br>
                123 ถนนสุขุมวิท เขตวัฒนา กรุงเทพฯ 10110
              </div>
              <div class="text-right font-mono font-bold text-sm text-black">
                ${order.OrderID}
              </div>
            </div>

            <!-- ส่วนผู้รับ (จ่าหน้าพัสดุ) -->
            <div class="mb-4">
              <div class="text-xs text-stone-500">กรุณาส่ง (ผู้รับ):</div>
              <div class="text-lg font-bold">${order.CustomerName}</div>
              <div class="text-sm font-semibold mb-1">โทร: ${order.Phone}</div>
              <div class="text-sm leading-relaxed">${order.Address}</div>
            </div>

            <!-- ส่วนรายการหยิบสินค้า (Pick List) -->
            <div class="bg-stone-100 p-3 rounded border border-dashed border-stone-400 text-sm">
              <div class="font-bold text-xs uppercase text-stone-600 mb-1">📋 รายการหยิบแพ็คสินค้า (Pick List):</div>
              <ul class="space-y-1">
                ${order.SKU_01_Qty > 0 ? `<li>☑️ <strong>[SKU-01]</strong> Dark 70% : <strong>${order.SKU_01_Qty} แท่ง</strong></li>` : ''}
                ${order.SKU_02_Qty > 0 ? `<li>☑️ <strong>[SKU-02]</strong> Milk Hazelnut : <strong>${order.SKU_02_Qty} แท่ง</strong></li>` : ''}
              </ul>
              <div class="mt-2 pt-1 border-t border-stone-300 text-xs flex justify-between">
                <span>ยอดรวม: ฿${order.TotalPrice}</span>
                <span>หมายเหตุ: ${order.SlipNote}</span>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        document.getElementById('loading').innerText = "โหลดข้อมูลไม่สำเร็จ ตรวจสอบ URL ของ Apps Script";
      }
    }

    loadOrders();
  </script>
</body>
</html>
